[project]
name = "cropyield"
version = "0.1.0"
description = "One-year-ahead crop yield forecasting by country and crop, with honest time-based evaluation."
authors = [
    { name = "pnastra", email = "pnastranagant@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=2.0.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
